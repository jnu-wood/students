<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>임산공학과 이수 자가진단</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --paper:#F6F8F5; --surface:#FFFFFF; --ink:#1F2A24; --sub:#5A6A5F;
  --pine:#1E5B3A; --pine-soft:#E3EEE6; --navy:#1F3A5F; --navy-soft:#E7ECF4;
  --amber:#B4842C; --amber-soft:#F6EEDC; --ok:#2E7D4F; --ok-soft:#E1F0E6;
  --need:#B23A3A; --need-soft:#F7E5E5; --line:#D9E1DA; --track:#E7ECE7;
  --chip:#EFF3EF; --shadow:0 1px 3px rgba(31,42,36,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141C17; --surface:#1B241E; --ink:#E7EDE8; --sub:#9FB0A5;
    --pine:#5DBB8A; --pine-soft:#22362A; --navy:#8FAAD1; --navy-soft:#232E3D;
    --amber:#D9A855; --amber-soft:#3A3021; --ok:#5DBB8A; --ok-soft:#22362A;
    --need:#E08383; --need-soft:#3B2626; --line:#2C3A30; --track:#26332A;
    --chip:#243029; --shadow:0 1px 3px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --paper:#141C17; --surface:#1B241E; --ink:#E7EDE8; --sub:#9FB0A5;
  --pine:#5DBB8A; --pine-soft:#22362A; --navy:#8FAAD1; --navy-soft:#232E3D;
  --amber:#D9A855; --amber-soft:#3A3021; --ok:#5DBB8A; --ok-soft:#22362A;
  --need:#E08383; --need-soft:#3B2626; --line:#2C3A30; --track:#26332A;
  --chip:#243029; --shadow:0 1px 3px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font-family:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  font-size:15px;line-height:1.65;padding:28px 20px 60px}
.wrap{max-width:1060px;margin:0 auto}
a{color:var(--pine)}
button{font-family:inherit;cursor:pointer}
input,select{font-family:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

.topbar{display:flex;align-items:flex-start;gap:12px}
.topbar .lead{flex:1}
.langbox{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;flex:none}
.langbox button{padding:6px 14px;font-size:12.5px;font-weight:700;background:var(--surface);
  color:var(--sub);border:none}
.langbox button.on{background:var(--navy);color:#fff}
.eyebrow{font-size:12.5px;font-weight:700;letter-spacing:.14em;color:var(--pine);text-transform:uppercase}
h1{font-family:'Noto Serif KR',serif;font-size:clamp(26px,4.2vw,36px);font-weight:700;
   color:var(--navy);letter-spacing:-.01em;text-wrap:balance;margin:4px 0 6px}
.lede{color:var(--sub);max-width:62ch}
.notice{margin-top:14px;font-size:13px;color:var(--sub);border-left:3px solid var(--amber);
        padding:6px 12px;background:var(--surface);border-radius:0 8px 8px 0}

.grid{display:grid;grid-template-columns:400px 1fr;gap:20px;margin-top:26px}
@media(max-width:860px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;
      padding:20px 22px;box-shadow:var(--shadow)}
.card h2{font-size:16px;font-weight:800;color:var(--navy);margin-bottom:14px;
         display:flex;align-items:center;gap:8px}
.card h2 .tag{font-size:11px;font-weight:700;color:var(--pine);background:var(--pine-soft);
              border-radius:99px;padding:2px 9px;letter-spacing:.05em}

.seg{display:grid;border:1px solid var(--line);
     border-radius:9px;overflow:hidden;margin-bottom:8px}
.seg.row2{grid-template-columns:1fr 1fr}
.seg.row3{grid-template-columns:1fr 1fr 1fr;margin-bottom:16px}
.seg button{padding:9px 2px;font-size:12.5px;font-weight:600;background:var(--surface);
            color:var(--sub);border:none;border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--pine);color:#fff}
.field{margin-bottom:13px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
.field input[type=number],.field select{width:100%;padding:9px 12px;font-size:18px;font-weight:800;
  font-variant-numeric:tabular-nums;border:1.5px solid var(--line);border-radius:9px;
  background:var(--paper)}
.field select{font-size:14px;font-weight:600}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.checks label{display:flex;align-items:center;gap:9px;font-size:13.5px;padding:8px 11px;
  border:1px solid var(--line);border-radius:9px;background:var(--paper);cursor:pointer}
.checks label:has(input:checked){border-color:var(--ok);background:var(--ok-soft)}
.checks input{width:16px;height:16px;accent-color:var(--pine);flex:none}
.checks .art{margin-left:auto;font-size:11px;color:var(--sub);white-space:nowrap;padding-left:6px}
.reset{margin-top:14px;width:100%;padding:8px;font-size:13px;font-weight:600;
  background:none;border:1px dashed var(--line);border-radius:9px;color:var(--sub)}
.reset:hover{color:var(--need);border-color:var(--need)}

.big{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.big .num{font-size:46px;font-weight:800;line-height:1;color:var(--pine)}
.big .of{font-size:17px;color:var(--sub);font-weight:600}
.verdict{margin-left:auto;font-size:14px;font-weight:800;padding:5px 14px;border-radius:99px}
.v-ok{background:var(--ok-soft);color:var(--ok)}
.v-need{background:var(--amber-soft);color:var(--amber)}
.trackbox{margin:20px 0 4px}
.track{position:relative;height:14px;border-radius:99px;background:var(--track)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:var(--pine);
      transition:width .45s cubic-bezier(.2,.8,.2,1)}
.mark{position:absolute;top:-7px;bottom:-7px;width:2.5px;background:var(--navy);opacity:.7}
.mlabel{position:absolute;top:20px;transform:translateX(-50%);font-size:11.5px;font-weight:700;
        color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.mlabel.end{transform:translateX(-92%)}
.mlabel b{color:var(--navy)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:48px}
@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}}
.stat{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--paper)}
.stat .k{font-size:12px;font-weight:700;color:var(--sub)}
.stat .v{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:12.5px;font-weight:600;color:var(--sub)}
.stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--amber)} .stat.need .v{color:var(--need)}
.reqlist{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
.reqlist h3{font-size:13.5px;font-weight:800;color:var(--sub);margin-bottom:9px}
.req{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:14px}
.req .dot{width:19px;height:19px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--chip);color:var(--sub)}
.req.done .dot{background:var(--ok);color:#fff}
.req.done{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--line)}
.req .why{margin-left:auto;font-size:12px;color:var(--sub);text-align:right}

.section{margin-top:34px}
.section>h2{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:700;color:var(--navy);
  margin-bottom:6px}
.section>h2.sectoggle{cursor:pointer;display:flex;align-items:center;gap:9px;user-select:none}
.sectoggle .chev{font-size:15px;color:var(--sub);font-family:'Noto Sans KR',sans-serif}
.sectoggle:hover .chev{color:var(--pine)}
.section>.sub{font-size:13.5px;color:var(--sub);margin-bottom:16px}
.tl{list-style:none;position:relative;padding-left:34px}
.tl::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:var(--line)}
.step{position:relative;padding:0 0 18px 6px}
.step .knob{position:absolute;left:-30px;top:2px;width:26px;height:26px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;
  font-size:12.5px;font-weight:800;color:var(--sub)}
.step.now .knob{background:var(--pine);border-color:var(--pine);color:#fff}
.step.past .knob{background:var(--pine-soft);border-color:var(--pine);color:var(--pine)}
.step .head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.step .head b{font-size:15.5px}
.step.now .head b{color:var(--pine)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--navy-soft);color:var(--navy);white-space:nowrap}
.badge.now{background:var(--pine);color:#fff}
.step .body{font-size:13.5px;color:var(--sub);margin-top:3px;max-width:70ch}
.step .dates{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.dchip{font-size:12px;font-weight:600;padding:3px 10px;border-radius:7px;background:var(--chip);
  font-variant-numeric:tabular-nums}
.dchip b{color:var(--pine);font-weight:800}

/* 장학금 */
.schctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:16px}
.scoregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:8px}
.scorebar{margin-top:12px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--paper)}
.scorebar .tot{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.scorebar .tot b{font-size:32px;color:var(--pine)}
.scorebar .seg2{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--track);margin:9px 0 5px}
.scorebar .seg2 i{display:block;height:100%}
.scorebar .lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--sub)}
.scorebar .lg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.gatewarn{margin-top:8px;font-size:12.5px;font-weight:700;color:var(--need)}
.schgroups{display:flex;flex-direction:column;gap:10px}
details.schgroup{border:1px solid var(--line);border-radius:10px;background:var(--paper)}
details.schgroup summary{list-style:none;display:flex;gap:8px;align-items:center;cursor:pointer;
  padding:10px 14px;font-size:14px;font-weight:800;color:var(--navy)}
details.schgroup summary::-webkit-details-marker{display:none}
details.schgroup summary::after{content:'▸';margin-left:auto;font-size:13px;color:var(--sub)}
details.schgroup[open] summary::after{content:'▾'}
details.schgroup .schcards{padding:0 12px 12px}
.schgroup .cnt{font-size:11px;font-weight:700;background:var(--chip);border-radius:99px;padding:1px 8px;color:var(--sub)}
.schcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:9px}
.sch{border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:var(--surface);font-size:12.5px;
     position:relative;display:block;color:inherit;text-decoration:none}
a.sch:hover{border-color:var(--pine)}
.sch .tip{display:none;position:absolute;left:8px;right:8px;bottom:calc(100% + 6px);z-index:9;
  background:var(--ink);color:var(--paper);font-size:11.5px;line-height:1.55;font-weight:500;
  padding:8px 11px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.25);pointer-events:none}
.sch .tip b{color:inherit}
.sch:hover .tip,.sch:focus-visible .tip{display:block}
.sch .n{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sch .amt{color:var(--pine);font-weight:700;margin-top:2px}
.sch .meta{color:var(--sub);margin-top:2px}
.sch .pill{font-size:10px;font-weight:800;border-radius:99px;padding:1px 7px;white-space:nowrap}
.sch.elig{border-color:var(--ok);background:var(--ok-soft)}
.sch.elig .pill{background:var(--ok);color:#fff}
.sch.dim{opacity:.5}
.sch.dim .pill{background:var(--chip);color:var(--sub)}
.sch.info .pill{background:var(--navy-soft);color:var(--navy)}

details.reg{border:1px solid var(--line);border-radius:10px;background:var(--surface);
  margin-bottom:9px;overflow:hidden}
details.reg summary{list-style:none;display:flex;align-items:center;gap:10px;cursor:pointer;
  padding:12px 16px;font-weight:700;font-size:14.5px}
details.reg summary::-webkit-details-marker{display:none}
details.reg summary::after{content:"+";margin-left:auto;font-size:18px;color:var(--sub);font-weight:600}
details.reg[open] summary::after{content:"−"}
details.reg .in{padding:2px 16px 14px;font-size:13.5px;color:var(--sub);border-top:1px solid var(--line)}
details.reg .in ul{padding-left:18px;margin:8px 0}
details.reg .in li{margin-bottom:4px}
.tblwrap{overflow-x:auto}
details.reg .in table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
details.reg .in th,details.reg .in td{border:1px solid var(--line);padding:6px 9px;text-align:left}
details.reg .in th{background:var(--chip);color:var(--ink);font-weight:700}

.ctabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.ctabs button{padding:7px 16px;font-size:13px;font-weight:700;border:1px solid var(--line);
  border-radius:99px;background:var(--surface);color:var(--sub)}
.ctabs button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:7px}
.course{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 10px;
  border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;line-height:1.35}
.course:has(input:checked){border-color:var(--pine);background:var(--pine-soft)}
.course input{accent-color:var(--pine);flex:none}
.course .nm small{display:block;font-size:10.5px;color:var(--sub)}
.course .code{margin-left:auto;font-size:10.5px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none;text-align:right}
.course .rq{font-size:9.5px;font-weight:800;color:var(--amber);display:block}
.sumline{display:flex;align-items:center;gap:12px;margin-top:13px;padding:10px 14px;
  border:1px dashed var(--line);border-radius:9px;font-size:13.5px;flex-wrap:wrap}
.sumline b{font-variant-numeric:tabular-nums}
.apply{padding:6px 16px;font-size:13px;font-weight:700;background:var(--pine);color:#fff;
  border:none;border-radius:8px}
.commonnote{margin-top:10px;font-size:12.5px;color:var(--sub)}

.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:14px}
.link{display:block;border:1px solid var(--line);border-radius:10px;background:var(--surface);
  padding:12px 15px;text-decoration:none;color:var(--ink)}
.link b{display:block;font-size:14px;color:var(--pine)}
.link span{font-size:12.5px;color:var(--sub);word-break:break-all}
footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--sub)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="topbar">
    <div class="lead">
      <div class="eyebrow" id="tEyebrow"></div>
      <h1 id="tTitle"></h1>
    </div>
    <div class="langbox" role="group" aria-label="Language">
      <button id="langKo" onclick="setLang('ko')">한국어</button>
      <button id="langEn" onclick="setLang('en')">English</button>
    </div>
  </div>
  <p class="lede" id="tLede"></p>
  <p class="notice" id="tNotice"></p>
</header>

<div class="grid">
  <div class="card">
    <h2><span id="tInput"></span> <span class="tag">INPUT</span></h2>
    <div class="seg row2" role="tablist" aria-label="undergraduate program">
      <button id="segB" onclick="setProg('B')"></button>
      <button id="segL" onclick="setProg('L')"></button>
    </div>
    <div class="seg row3" role="tablist" aria-label="graduate program">
      <button id="segM" class="on" onclick="setProg('M')"></button>
      <button id="segD" onclick="setProg('D')"></button>
      <button id="segC" onclick="setProg('C')"></button>
    </div>

    <div id="inGrad">
      <div class="field">
        <label for="credits" id="tCredits"></label>
        <input type="number" id="credits" min="0" max="99" step="1" value="0" oninput="render()">
      </div>
      <div class="field">
        <label id="tChecks"></label>
        <div class="checks">
          <label><input type="checkbox" id="ckLang" onchange="render()"> <span id="tCkLang"></span> <span class="art" id="aCkLang"></span></label>
          <label><input type="checkbox" id="ckComp" onchange="render()"> <span id="tCkComp"></span> <span class="art" id="compArt"></span></label>
          <label><input type="checkbox" id="ckEthic" onchange="render()"> <span id="tCkEthic"></span> <span class="art" id="aCkEthic"></span></label>
          <label><input type="checkbox" id="ckPlan" onchange="render()"> <span id="tCkPlan"></span> <span class="art" id="aCkPlan"></span></label>
          <label><input type="checkbox" id="ckSubmit" onchange="render()"> <span id="tCkSubmit"></span> <span class="art" id="aCkSubmit"></span></label>
          <label><input type="checkbox" id="ckDef" onchange="render()"> <span id="tCkDef"></span> <span class="art" id="aCkDef"></span></label>
        </div>
      </div>
    </div>

    <div id="inBach" style="display:none">
      <div class="frow">
        <div class="field">
          <label for="bTotal" id="tBTotal"></label>
          <input type="number" id="bTotal" min="0" max="160" step="1" value="0" oninput="render()">
        </div>
        <div class="field">
          <label for="bMajor" id="tBMajor"></label>
          <input type="number" id="bMajor" min="0" max="99" step="1" value="0" oninput="render()">
        </div>
      </div>
      <div class="frow">
        <div class="field">
          <label for="bSem" id="tBSem"></label>
          <input type="number" id="bSem" min="0" max="12" step="1" value="0" oninput="render()">
        </div>
        <div class="field">
          <label for="bGpa" id="tBGpa"></label>
          <input type="number" id="bGpa" min="0" max="4.5" step="0.01" value="0" oninput="render()">
        </div>
      </div>
      <div id="inLink" style="display:none">
        <div class="field">
          <label for="lkGrad" id="tLkGrad"></label>
          <input type="number" id="lkGrad" min="0" max="12" step="1" value="0" oninput="render()">
        </div>
        <div class="field">
          <div class="checks">
            <label><input type="checkbox" id="ckLSel" onchange="render()"> <span id="tCkLSel"></span></label>
            <label><input type="checkbox" id="lkBk" onchange="render()"> <span id="tLkBk"></span></label>
          </div>
        </div>
      </div>
      <div class="field">
        <label id="tBChecks"></label>
        <div class="checks">
          <label><input type="checkbox" id="ckBReq" onchange="render()"> <span id="tCkBReq"></span></label>
          <label><input type="checkbox" id="ckBGE" onchange="render()"> <span id="tCkBGE"></span></label>
          <label id="rowBExam"><input type="checkbox" id="ckBExam" onchange="render()"> <span id="tCkBExam"></span> <span class="art" id="aBExam"></span></label>
          <label><input type="checkbox" id="ckBEng" onchange="render()"> <span id="tCkBEng"></span></label>
        </div>
      </div>
    </div>

    <button class="reset" id="tReset" onclick="resetAll()"></button>
  </div>

  <div class="card">
    <h2><span id="tStatus"></span> <span class="tag">STATUS</span></h2>
    <div class="big">
      <span class="num" id="bigNum">0</span>
      <span class="of" id="bigOf"></span>
      <span class="verdict v-need" id="verdict"></span>
    </div>
    <div class="trackbox">
      <div class="track">
        <div class="fill" id="fill" style="width:0%"></div>
        <div class="mark" id="markQ" style="left:75%"></div>
        <div class="mark" style="left:100%"></div>
        <div class="mlabel" id="labelQ" style="left:75%"></div>
        <div class="mlabel end" id="labelF" style="left:100%"></div>
      </div>
    </div>
    <div class="stats" id="statBox"></div>
    <div class="reqlist">
      <h3 id="tReqTitle"></h3>
      <div id="reqRows"></div>
    </div>
  </div>
</div>

<!-- 장학금 진단 -->
<section class="section">
  <h2 class="sectoggle" role="button" tabindex="0" aria-controls="schBody"
      onclick="toggleSchSec()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleSchSec();}">
    <span id="tSchTitle"></span><span class="chev" id="schChev">▾</span></h2>
  <div id="schBody">
  <p class="sub" id="tSchSub"></p>
  <div class="card">
    <!-- 대학원용 조건 -->
    <div id="schGradCtrl" class="schctrl">

/* ================= 교과목 ================= */
function setTab(t){tab=t; buildCourses(); render();}
function buildCourses(){
  const tabs=$('ctabs'); tabs.innerHTML='';
  const bLabel=lang==='en'?'Undergraduate courses (2026 curriculum)':'학사과정 교과목 (2026 교과과정)';
  if(prog==='B'){
    const bt=document.createElement('button'); bt.className='on';
    bt.textContent=bLabel;
    tabs.appendChild(bt);
  }else if(prog==='L'){
    [['B',{ko:'학사과정 교과목',en:'Undergraduate courses'}],['M',{ko:'대학원(석사) 교과목',en:'Graduate (MS) courses'}]].forEach(([k,lab])=>{
      const b=document.createElement('button'); b.textContent=L(lab);
      b.classList.toggle('on',tab===k); b.onclick=()=>setTab(k);
      tabs.appendChild(b);});
  }else{
    [['M',S.tabM],['D',S.tabD]].forEach(([k,lab])=>{
      const b=document.createElement('button'); b.textContent=L(lab);
      b.classList.toggle('on',tab===k); b.onclick=()=>setTab(k);
      tabs.appendChild(b);});
  }
  const box=$('courseList'); box.innerHTML='';
  (COURSES[tab]||[]).forEach((c,i)=>{
    const [nk,code,ne,rq]=c;
    const id='c_'+tab+'_'+i;
    const l=document.createElement('label'); l.className='course';
    const nameHtml = lang==='en'
      ? `<span class="nm">${ne}<small>${nk}</small></span>`
      : `<span class="nm">${nk}</span>`;
    const tagTxt = (prog==='B')
      ? `${code}${rq?'<span class="rq">★'+(lang==='en'?'REQ':'전필')+'</span>':''}`
      : code;
    l.innerHTML=`<input type="checkbox" id="${id}" ${ckState[id]?'checked':''}> ${nameHtml} <span class="code">${tagTxt}</span>`;
    l.querySelector('input').addEventListener('change',e=>{
      ckState[id]=e.target.checked; saveCk(); sumCk();});
    box.appendChild(l);});
  const isU = prog==='B'||prog==='L';
  $('courseNote').textContent = isU&&tab==='B'?L(S.courseNoteB):L(S.courseNoteG);
  $('tApply').textContent =
    prog==='B' ? L(S.applyB)
    : prog==='L' ? (tab==='B'?L(S.applyB):(lang==='en'?'Apply to graduate credits':'이 값을 대학원 과목 학점에 적용'))
    : L(S.apply);
  sumCk();}
function countCk(){
  /* B: 학사 목록 / L: 현재 탭 목록 / 대학원: 석·박 목록 합산(박사는 석사 초과학점 인정) */
  const prefs = prog==='B'?['c_B_'] : prog==='L'?['c_'+tab+'_'] : ['c_M_','c_D_'];
  return Object.entries(ckState).filter(([k,v])=>v&&prefs.some(p=>k.startsWith(p))).length;}
function sumCk(){
  const n=countCk();
  const f=S.sumText[lang]||S.sumText.ko;
  $('sumText').innerHTML=f(n,n*3);}
function applySum(){
  const n=countCk();
  if(prog==='B') $('bMajor').value=n*3;
  else if(prog==='L'){ if(tab==='B') $('bMajor').value=n*3; else $('lkGrad').value=n*3; }
  else $('credits').value=n*3;
  render();}

/* ================= 렌더 ================= */
function render(){
  if(prog==='B') renderB(); else if(prog==='L') renderL(); else renderG();
  renderSch(); save();
}

    [N?`③ Comprehensive exam (${L(R.fields)})`:`③ 종합시험 합격 (${L(R.fields)} 이상)`, comp, c<R.qual?(N?`needs ${R.qual} cr`:`응시자격 ${R.qual}학점 필요`):''],

function stepHtml(s,i,cls,isNow,body){
  const d1=s.d1?L(s.d1):null, d2=s.d2?L(s.d2):null;

  return `<li class="step ${cls}"><span class="knob">${i+1}</span>
    <div class="head"><b>${L(s.t)}</b><span class="badge ${isNow?'now':''}">${isNow?L(S.nowStage):L(s.reg)}</span>${isNow?'<span class="badge">'+L(s.reg)+'</span>':''}</div>
    <div class="body">${body}</div>${dates}</li>`;}

function schCard(o,elig,info,src){

  const pill=info?L(S.pillInfo):(elig?L(S.pillOk):L(S.pillNo));
  const url=o.u||(src?src.u:null);
  const tip=src?`<span class="tip">${L(src.s)}${url?'<br><b>'+url.replace(/^https?:\/\//,'')+'</b> ↗ '+(o.u?'':L(src.ul)):''}</span>`:'';
  const inner=`${tip}<div class="n">${L(o.n)} <span class="pill">${pill}</span></div>
  <div class="amt">${L(o.a)}</div><div class="meta">${L(o.w)}${o.c?' · '+L(o.c):''}</div>`;
  return url
    ? `<a class="sch ${cls}" href="${url}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="sch ${cls}" tabindex="0">${inner}</div>`;}

function renderSch(){
  $('tSchSub').textContent = prog==='B'?L(S.schSubB):(prog==='L'?L(S.schSubL):L(S.schSubG));
  const box=$('schGroups');
  if(prog==='L'){
    const sel=$('ckLSel').checked, bk=$('lkBk').checked;
    const linkSch=[
      {n:{ko:'학부연구생 장학 (연계과정)',en:'Undergraduate Researcher Scholarship'}, a:{ko:'100만원/학기 (3학기 이내)',en:'₩1M/semester (up to 3)'}, w:{ko:'4월·10월 · ☎5902',en:'Apr·Oct · ext.5902'},
       c:{ko:'연계과정생 (선발)',en:'Track students (selective)'}, ok:sel},
      {n:{ko:'연계과정생 감면장학',en:'Track Tuition Reduction'}, a:{ko:'석사 수업료1 감면 (전체 학기, 자동)',en:'MS tuition reduction, all semesters (automatic)'}, w:{ko:'☎1085',en:'ext.1085'},
       c:{ko:'연계과정생 전체',en:'All track students'}, ok:sel},
      {n:{ko:'주니어 BK 장학',en:'Junior BK Scholarship'}, a:{ko:'40만원/월 (학부 마지막 학기)',en:'₩400,000/month (final undergraduate semester)'}, w:{ko:'공고 2·8월 · ☎5917',en:'Feb·Aug · ext.5917'},
       c:{ko:'BK21 참여학과 연계과정생 (추천)',en:'Track students in BK21 dept. (nominated)'}, ok:sel&&bk}];
    const nextSch=[
      {n:{ko:'도전장학(미래)',en:'Challenge Scholarship (Mirae)'}, a:{ko:'인문사회 170 / 이공 230만원',en:'₩1.7M / ₩2.3M (STEM)'}, w:{ko:'8월·2월 · ☎5902',en:'Aug·Feb · ext.5902'},
       c:{ko:'본교 학부 졸업(예정) → 석사 진학',en:'CNU bachelor → MS'}, ok:true},
      {n:{ko:'근로장학 RA·TA·GA',en:'RA·TA·GA Assistantships'}, a:{ko:'석사 30~40만원/월',en:'₩300–400K/month (MS)'}, w:{ko:'3월·9월 · ☎5902',en:'Mar·Sep · ext.5902'},
       c:{ko:'대학원 재학생 (추천)',en:'Enrolled graduate students'}, ok:true}];
    box.innerHTML=
      grp(S.grpLink, linkSch.map(o=>schCard(o,o.ok,false,SRC.grad)))+
      grp(S.grpNext, nextSch.map(o=>schCard(o,false,true,SRC.grad)));
    attachSchToggles();
    return;
  }
  if(prog==='B'){
    /* 점수 계산 */
    const gpa=Math.max(0,parseFloat($('bGpa').value)||0);
    const toeic=Math.max(0,parseInt($('bToeic').value||'0',10));
    const act=Math.max(0,parseInt($('bAct').value||'0',10));
    const club=$('bClub').value, council=$('bCouncil').checked, fresh=$('bFresh').checked;
    const sGpa=Math.min(50, gpa*50/4.5);
    const sLang= toeic>=700?20 : toeic>=600?15 : toeic>=500?10 : toeic>=400?5 : 0;
    const sAct= council?10 : (act>=4?10 : act>=3?8 : act>=2?6 : act>=1?4 : 2);
    const sClub= club==='leader'?20 : club==='member'?10 : 0;
    const total=Math.round((sGpa+sLang+sAct+sClub)*10)/10;
    const gateOK=gpa>=2.0;
    const segs=[['#1E5B3A',sGpa,L(S.scGpa)],['#1F3A5F',sLang,L(S.scLang)],['#B4842C',sAct,L(S.scAct)],['#2E7D4F',sClub,L(S.scClub)]];
    $('scoreBar').innerHTML=
      `<div class="tot"><span style="font-size:13px;font-weight:700;color:var(--sub)">${L(S.scoreTitle)}</span><b>${total}</b><span style="color:var(--sub)">/ 100</span></div>
       <div class="seg2">${segs.map(([c,v])=>`<i style="width:${v}%;background:${c}"></i>`).join('')}</div>
       <div class="lg">${segs.map(([c,v,n])=>`<span><i style="background:${c}"></i>${n} : ${Math.round(v*10)/10}</span>`).join('')}</div>
       ${gateOK?'':'<div class="gatewarn">'+L(S.scoreGate)+'</div>'}
       <div style="margin-top:8px;font-size:12px;color:var(--sub);line-height:1.55">${L(S.scoreNote)}</div>`;
    box.innerHTML=
      grp(S.grpIn, SCH_B.in.map(o=>{
        const elig = o.tag==='fresh'?fresh : (o.tag==='merit'?gateOK : o.tag==='grad'?gateOK : true);
        const info = o.tag==='special' || o.tag==='living';
        return schCard(o, elig, info, SRC.bIn);}), S.rankNote)+
      grp(S.grpFund, SCH_B.fund.map(o=>schCard(o, gateOK, false, SRC.bFund)), S.rankNote)+
      grp(S.grpOut, SCH_B.out.map(o=>schCard(o, false, true, SRC.bOut)));
  }else{
    const s={status:$('gStatus').value, cnu:$('gCnu').checked, bk:$('gBk').checked};
    box.innerHTML=
      grp(S.grpAdm, SCH_G.adm.map(o=>schCard(o, o.el(s), false, SRC.grad)))+
      grp(S.grpEnr, SCH_G.enr.map(o=>schCard(o, o.el(s), false, SRC.grad)))+
      grp(S.grpBk, SCH_G.bk.map(o=>schCard(o, o.el(s), false, SRC.grad)))+
      grp(S.grpAward, SCH_G.award.map(o=>schCard(o, o.el(s), false, SRC.grad)))+
      grp(S.grpSup, SCH_G.sup.map(o=>schCard(o, o.el(s), false, SRC.grad)));
  }
  attachSchToggles();
}
/* 장학금 진단 섹션 전체 접기/펼치기 */
let schSecOpen=true;
try{schSecOpen = localStorage.getItem('wood_diag_schsec')!=='0';}catch(e){}
function applySchSec(){
  $('schBody').style.display = schSecOpen?'':'none';
  $('schChev').textContent = schSecOpen?'▾':'▸';
  const h=$('schChev').parentElement;
  if(h) h.setAttribute('aria-expanded', schSecOpen?'true':'false');
}
function toggleSchSec(){
  schSecOpen=!schSecOpen; applySchSec();
  try{localStorage.setItem('wood_diag_schsec', schSecOpen?'1':'0');}catch(e){}
}

const schOpen={};   /* 그룹별 접힘 상태 (세션 내 유지) */
function grp(title,cards,note){
  const k=title.ko;
  const open=schOpen[k]!==false;
  return `<details class="schgroup" data-k="${k}" ${open?'open':''}><summary>${L(title)} <span class="cnt">${cards.length}</span>${note?'<span class="cnt" style="background:var(--amber-soft);color:var(--amber)">'+L(note)+'</span>':''}</summary>
  <div class="schcards">${cards.join('')}</div></details>`;}
function attachSchToggles(){
  document.querySelectorAll('#schGroups details.schgroup').forEach(d=>{
    d.addEventListener('toggle',()=>{schOpen[d.dataset.k]=d.open;});});}

function renderRegs(){
  const isU = prog==='B'||prog==='L';
  $('tRegSub').textContent = isU?L(S.regSubB):L(S.regSubG);
  const regs = prog==='B'?REGS_B : prog==='L'?[REGS_B[4],REGS_B[0],REGS_B[1],REGS_B[5]] : REGS_G;
  $('regBox').innerHTML=regs.map(r=>
    `<details class="reg"><summary><span class="badge">${L(r.b)}</span> ${L(r.t)}</summary>
     <div class="in">${L(r.h)}</div></details>`).join('');}

function renderLinks(){
  $('linkBox').innerHTML=LINKS.map(l=>
    `<a class="link" href="${l.u}" target="_blank" rel="noopener"><b>${L(l.t)}</b><span>${l.s}</span></a>`).join('');}

/* init */
restore();
(function(){
  const isU = prog==='B'||prog==='L';
  ['B','L','M','D','C'].forEach(k=>$('seg'+k).classList.toggle('on',k===prog));
  $('inGrad').style.display = isU?'none':'';
  $('inBach').style.display = isU?'':'none';
  $('inLink').style.display = prog==='L'?'':'none';
  $('schGradCtrl').style.display = isU?'none':'';
  $('schBachCtrl').style.display = prog==='B'?'':'none';
  $('aBExam').style.display = prog==='L'?'':'none';
  tab = (prog==='B'||prog==='L')?'B':(prog==='D'?'D':'M');
})();
applyLang(); applySchSec(); buildCourses(); renderRegs(); renderLinks(); render();
</script>
